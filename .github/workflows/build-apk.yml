name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          settings="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' | head -n 1)"
          test -n "$settings" || { echo "No Gradle settings file found"; exit 1; }
          dir="$(dirname "$settings")"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug
      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(grep -oE 'versionName = "[^"]+"' "${{ steps.project.outputs.dir }}/app/build.gradle.kts" | head -n1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Rename APK with app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'versionName = "[^"]+"' "${{ steps.project.outputs.dir }}/app/build.gradle.kts" | head -n1 | cut -d'"' -f2)
          mkdir -p artifacts
          cp "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" "artifacts/Weekly-Life-Planner-v${VERSION}-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Life-Planner-v${{ steps.app_version.outputs.version }}-debug-APK
          path: artifacts/Weekly-Life-Planner-v*-debug.apk
          if-no-files-found: error
