name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          settings="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' | head -n 1)"
          test -n "$settings" || { echo "No Gradle settings file found"; exit 1; }
          dir="$(dirname "$settings")"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug
      - name: Rename APK with app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/Weekly-Life-Planner-v${VERSION}-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Life-Planner-v1.0.1-debug-APK
          path: artifacts/Weekly-Life-Planner-v*-debug.apk
          if-no-files-found: error
