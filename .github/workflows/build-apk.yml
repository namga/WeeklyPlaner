name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          settings="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' | head -n 1)"
          test -n "$settings" || { echo "No Gradle settings file found"; exit 1; }
          dir="$(dirname "$settings")"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weekly-life-planner-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
