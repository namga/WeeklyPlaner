name: Android debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Rename APK with app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/Weekly-Life-Planner-v${VERSION}-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Life-Planner-v${{ steps.app_version.outputs.version }}-debug-APK
          path: artifacts/Weekly-Life-Planner-v*-debug.apk
          if-no-files-found: error
          retention-days: 14
