name: Android debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK with app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/Weekly-Life-Planner-v${VERSION}-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Life-Planner-v1.0.1-debug-APK
          path: artifacts/Weekly-Life-Planner-v*-debug.apk
          if-no-files-found: error
          retention-days: 14
