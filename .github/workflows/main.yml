name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        run: |
          if [ -f android/settings.gradle ]; then
            echo "Android project found in android/"
          elif [ -f settings.gradle ]; then
            echo "Android project found in repository root"
          else
            echo "Android settings.gradle not found"
            find . -name settings.gradle -type f
            exit 1
          fi

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Planer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
