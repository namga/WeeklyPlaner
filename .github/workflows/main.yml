name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        run: |
          if [ -f android/settings.gradle ]; then
            echo "Android project found in android/"
          elif [ -f settings.gradle ]; then
            echo "Android project found in repository root"
          else
            echo "Android settings.gradle not found"
            find . -name settings.gradle -type f
            exit 1
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug
  
      - name: Rename APK with app version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          fi
          VERSION=${VERSION:-1.0.1}

          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" "Weekly-Life-Planner-v${VERSION}-debug.apk"
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weekly-life-planner-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

